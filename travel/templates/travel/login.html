{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - TRIP</title>
    <link rel="stylesheet" href="{% static 'travel/style.css' %}">
</head>
<body>
    <header>
        <div class="logo"><a href="{% url 'index' %}" style="color:white; text-decoration:none;">TRIP</a></div>
    </header>

    <main>
        <section class="form-section">
            <div class="section-title">
                <h2>ログイン</h2>
            </div>

            <div class="form-container">
                {% if error %}
                <div class="alert alert-error">{{ error }}</div>
                {% endif %}

                <form method="post" action="{% url 'login' %}" class="custom-form">
                    {% csrf_token %}
                    
                    <div class="form-group">
                        <label>ユーザー名またはメールアドレス</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label>パスワード</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label style="display:flex; align-items:center; gap:8px;">
                            <input type="checkbox" name="remember"> ログイン状態を保持する（30日間）
                        </label>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-main">ログイン</button>
                    </div>

                    <p class="auth-link">
                        アカウントをお持ちではないですか？ <a href="{% url 'register' %}">登録</a>
                    </p>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
