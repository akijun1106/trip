{% extends 'travel/base.html' %}
{% block content %}
<h1>カレンダー</h1>
<form method="post">
  {% csrf_token %}
  <label>日付: <input type="date" name="date" required></label>
  <label>タイトル: <input type="text" name="title" required></label>
  <button type="submit">追加</button>
</form>

<h2>予定一覧</h2>
<ul>
  {% for ev in events %}
    <li>{{ ev.date }} - {{ ev.title }}</li>
  {% empty %}
    <li>予定はありません。</li>
  {% endfor %}
</ul>
{% endblock %}
