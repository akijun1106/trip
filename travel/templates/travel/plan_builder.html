{% extends 'travel/base.html' %}
{% block content %}
<h1>プラン計画</h1>
<form method="post">
  {% csrf_token %}
  <div id="legs">
    <div class="leg">
      <input type="text" name="start" placeholder="出発地">
      <input type="text" name="end" placeholder="目的地">
      <select name="transport">
        <option value="歩き">歩き</option>
        <option value="自転車">自転車</option>
        <option value="くるま">くるま</option>
        <option value="バス">バス</option>
        <option value="電車">電車</option>
        <option value="新幹線">新幹線</option>
        <option value="飛行機">飛行機</option>
      </select>
      <input type="number" name="leg_cost" placeholder="費用">
      <button type="button" class="remove-leg">削除</button>
    </div>
  </div>
  <button type="button" id="add-leg">経路を追加</button>
  <div>
    <label>日数: <input type="number" name="days" value="1" min="1"></label>
    <label>合計予算: <input type="number" name="total_cost"></label>
  </div>
  <button type="submit">プランを保存</button>
</form>

<script>
document.getElementById('add-leg').addEventListener('click', function(){
  const div = document.createElement('div');
  div.className = 'leg';
  div.innerHTML = `
    <input type="text" name="start" placeholder="出発地">
    <input type="text" name="end" placeholder="目的地">
    <select name="transport">
      <option value="歩き">歩き</option>
      <option value="自転車">自転車</option>
      <option value="くるま">くるま</option>
      <option value="バス">バス</option>
      <option value="電車">電車</option>
      <option value="新幹線">新幹線</option>
      <option value="飛行機">飛行機</option>
    </select>
    <input type="number" name="leg_cost" placeholder="費用">
    <button type="button" class="remove-leg">削除</button>
  `;
  document.getElementById('legs').appendChild(div);
});

document.addEventListener('click', function(e){
  if(e.target && e.target.classList.contains('remove-leg')){
    e.target.closest('.leg').remove();
  }
});
</script>

{% endblock %}
