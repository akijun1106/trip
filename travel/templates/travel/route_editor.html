{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ルートエディタ - TRIP</title>
    <link rel="stylesheet" href="{% static 'travel/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <style>
        .route-editor-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            height: calc(100vh - 100px);
            padding: 20px;
        }
        
        @media (max-width: 768px) {
            .route-editor-container {
                grid-template-columns: 1fr;
                height: auto;
                min-height: 100vh;
            }
        }
        
        .map-container {
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        
        #map {
            width: 100%;
            height: 100%;
            min-height: 400px;
        }
        
        .timeline-container {
            background: white;
            border-radius: 10px;
            padding: 20px;
            overflow-y: auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        
        .waypoint-item {
            background: #f8fbfb;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid var(--primary);
            cursor: move;
            transition: 0.2s;
        }
        
        .waypoint-item:hover {
            background: #e8f8fb;
        }
        
        .waypoint-time {
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 5px;
        }
        
        .waypoint-name {
            font-size: 1.1rem;
            margin-bottom: 5px;
        }
        
        .waypoint-delete {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            margin-top: 10px;
        }
        
        .waypoint-delete:hover {
            background: #ff5252;
        }
        
        .stats-box {
            background: var(--primary);
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .stats-item {
            display: inline-block;
            margin: 0 15px;
        }
        
        .add-waypoint-form {
            background: #f8fbfb;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .add-waypoint-form input {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        
        .add-waypoint-form button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        
        .add-waypoint-form button:hover {
            background: #7cde8f;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">TRIP</div>
        <div class="menu-title">{{ plan.destination }}のルートエディタ</div>
    </header>

    <div class="route-editor-container">
        <!-- 地図 -->
        <div class="map-container">
            <div id="map"></div>
        </div>

        <!-- タイムライン -->
        <div class="timeline-container">
            <h2>{{ plan.days }}日間の日程</h2>
            
            <!-- 統計情報 -->
            <div class="stats-box">
                <div class="stats-item">
                    <strong id="total-distance">0.0</strong> km
                </div>
                <div class="stats-item">
                    <strong id="total-duration">0</strong> 分
                </div>
            </div>

            <!-- ウェイポイント追加フォーム -->
            <div class="add-waypoint-form">
                <input type="text" id="waypoint-name" placeholder="地点名（例：京都駅）">
                <input type="number" id="waypoint-lat" placeholder="緯度" step="0.0001">
                <input type="number" id="waypoint-lng" placeholder="経度" step="0.0001">
                <input type="date" id="waypoint-date" value="{{ plan.destination }}">
                <button onclick="addWaypoint()">ウェイポイント追加</button>
            </div>

            <!-- ウェイポイントリスト -->
            <div id="waypoints-list"></div>
        </div>
    </div>

    <!-- Leaflet ライブラリ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script>
        // グローバル変数
        let map;
        let waypoints = [];
        let markers = [];

        // 初期化
        function initMap() {
            // 日本の中心を地点
            map = L.map('map').setView([36.2025, 138.2529], 5);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);

            // 地図クリックでウェイポイント追加
            map.on('click', function(e) {
                document.getElementById('waypoint-lat').value = e.latlng.lat.toFixed(4);
                document.getElementById('waypoint-lng').value = e.latlng.lng.toFixed(4);
            });

            loadWaypoints();
        }

        // ウェイポイント追加
        function addWaypoint() {
            const name = document.getElementById('waypoint-name').value;
            const lat = parseFloat(document.getElementById('waypoint-lat').value);
            const lng = parseFloat(document.getElementById('waypoint-lng').value);
            const date = document.getElementById('waypoint-date').value;

            if (!name || isNaN(lat) || isNaN(lng)) {
                alert('すべてのフィールドを入力してください');
                return;
            }

            const waypoint = { name, lat, lng, date };
            waypoints.push(waypoint);

            // UI更新
            renderWaypoints();
            calculateDistance();
            clearForm();
        }

        // ウェイポイント削除
        function deleteWaypoint(index) {
            waypoints.splice(index, 1);
            renderWaypoints();
            calculateDistance();
        }

        // UI描画
        function renderWaypoints() {
            const list = document.getElementById('waypoints-list');
            list.innerHTML = '';

            waypoints.forEach((wp, index) => {
                const div = document.createElement('div');
                div.className = 'waypoint-item';
                div.draggable = true;
                div.innerHTML = `
                    <div class="waypoint-time">${wp.date}</div>
                    <div class="waypoint-name">${wp.name}</div>
                    <div>
                        <small>${wp.lat.toFixed(4)}, ${wp.lng.toFixed(4)}</small>
                    </div>
                    <button class="waypoint-delete" onclick="deleteWaypoint(${index})">削除</button>
                `;
                div.addEventListener('dragstart', (e) => {
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('index', index);
                });
                list.appendChild(div);
            });

            updateMap();
        }

        // 地図更新
        function updateMap() {
            // 既存マーカー削除
            markers.forEach(marker => map.removeLayer(marker));
            markers = [];

            // 新しいマーカー追加
            waypoints.forEach((wp, index) => {
                const marker = L.marker([wp.lat, wp.lng])
                    .bindPopup(`<b>${wp.name}</b><br>${wp.date}`)
                    .addTo(map);
                markers.push(marker);
            });

            // ポリラインで結ぶ
            if (waypoints.length > 1) {
                const latlngs = waypoints.map(wp => [wp.lat, wp.lng]);
                L.polyline(latlngs, { color: 'blue', weight: 2 }).addTo(map);
            }
        }

        // 距離計算
        function calculateDistance() {
            if (waypoints.length < 2) return;

            fetch('{% url "calculate_distance_api" %}', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify({ waypoints })
            })
            .then(resp => resp.json())
            .then(data => {
                document.getElementById('total-distance').textContent = data.total_distance;
                document.getElementById('total-duration').textContent = data.total_duration;
            })
            .catch(err => console.error(err));
        }

        // その他関数
        function loadWaypoints() {
            // 後で実装（DBから読み込み）
        }

        function clearForm() {
            document.getElementById('waypoint-name').value = '';
            document.getElementById('waypoint-lat').value = '';
            document.getElementById('waypoint-lng').value = '';
        }

        // ページロード時に初期化
        window.addEventListener('load', initMap);
    </script>
</body>
</html>
