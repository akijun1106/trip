services:
  - type: web
    name: trip-app
    env: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi --workers 2 --worker-class sync --timeout 60 --access-logfile -
    envVars:
      - key: DEBUG
        value: false
      - key: PYTHON_VERSION
        value: 3.13.9
      - key: DATABASE_URL
        fromDatabase:
          name: trip_db
          property: connectionString
databases:
  - name: trip_db
    databaseName: trip_production
    plan: free
